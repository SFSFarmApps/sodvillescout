name: Scout application checks
on:
  pull_request:
    paths: ['*.js', '*.html', '*.cjs', 'package*.json', '.github/workflows/scout-checks.yml']
  push:
    branches: [main]
    paths: ['*.js', '*.html', '*.cjs', 'package*.json', '.github/workflows/scout-checks.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check labor-log.js
      - run: npm test
