name: Update Field Rainfall
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    paths:
      - '.github/workflows/rainfall.yml'
      - 'rainfall-trigger.txt'
      - 'scripts/update-rainfall.py'
      - 'test/test_rainfall.py'
permissions:
  contents: write
concurrency:
  group: rainfall-update
  cancel-in-progress: true
jobs:
  rainfall:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build rainfall.json from NOAA MRMS
        shell: bash
        run: |
          python3 -m unittest discover -s test -p 'test_rainfall.py'
          python3 scripts/update-rainfall.py
      - name: Commit rainfall data
        run: |
          git config user.name "Sodville Rainfall Bot"
          git config user.email "actions@users.noreply.github.com"
          git add rainfall.json rainfall-history.json
          git diff --cached --quiet || git commit -m "Update NOAA MRMS field rainfall"
          git pull --rebase origin main
          git push
