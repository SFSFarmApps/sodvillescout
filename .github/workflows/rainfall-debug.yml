name: Rainfall MRMS Diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rainfall-debug.yml'
permissions:
  contents: write
jobs:
  test-mrms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query NOAA MRMS at Taft Gin South
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, datetime
          base="https://mapservices.weather.noaa.gov/raster/rest/services/obs/mrms_qpe/ImageServer/identify"
          lon,lat=-97.330,28.019
          out={"field":"TaftGinSouth 3700-H","point":{"lon":lon,"lat":lat},"queried_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"results":{}}
          for hours in (24,48,72):
              raster=f"mrms_{hours}h_co"
              renderer=f"rft_{hours}hr"
              qbase="https://mapservices.weather.noaa.gov/raster/rest/services/obs/mrms_qpe/ImageServer/query"
              qparams={"where":f"name = '{raster}'","outFields":"objectid,name","returnGeometry":"false","f":"json"}
              with urllib.request.urlopen(qbase+"?"+urllib.parse.urlencode(qparams),timeout=30) as qr:
                  catalog=json.loads(qr.read().decode())
              feats=catalog.get("features",[])
              oid=feats[0]["attributes"]["objectid"] if feats else None
              params={
                "geometry":json.dumps({"x":lon,"y":lat,"spatialReference":{"wkid":4326}}),
                "geometryType":"esriGeometryPoint",
                "returnGeometry":"false",
                "returnCatalogItems":"true",
                "mosaicRule":json.dumps({"mosaicMethod":"esriMosaicLockRaster","lockRasterIds":[oid]}) if oid is not None else "",
                "renderingRule":json.dumps({"rasterFunction":renderer}),
                "f":"json"
              }
              url=base+"?"+urllib.parse.urlencode(params)
              try:
                  with urllib.request.urlopen(url,timeout=30) as r:
                      raw=json.loads(r.read().decode())
                  samplebase="https://mapservices.weather.noaa.gov/raster/rest/services/obs/mrms_qpe/ImageServer/getSamples"
                  sparams={
                    "geometryType":"esriGeometryPoint",
                    "geometry":json.dumps({"x":lon,"y":lat,"spatialReference":{"wkid":4326}}),
                    "mosaicRule":json.dumps({"mosaicMethod":"esriMosaicAttribute","where":f"idp_subset = 'conus_QPE_{hours}H'"}),
                    "f":"json"
                  }
                  with urllib.request.urlopen(samplebase+"?"+urllib.parse.urlencode(sparams),timeout=30) as sr:
                      samples=json.loads(sr.read().decode())
                  out["results"][str(hours)]={"raster":raster,"renderer":renderer,"catalog":catalog,"response":raw,"samples":samples}
              except Exception as e:
                  out["results"][str(hours)]={"raster":raster,"renderer":renderer,"error":repr(e)}
          with open("rainfall-debug.json","w") as f: json.dump(out,f,indent=2)
          PY
      - name: Commit diagnostic response
        run: |
          git config user.name "Sodville Rainfall Bot"
          git config user.email "actions@users.noreply.github.com"
          git add rainfall-debug.json
          git diff --cached --quiet || git commit -m "Update MRMS rainfall diagnostic"
          git push
